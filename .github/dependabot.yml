version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    
    groups:
      all-npm-dependencies:
        patterns:
          - "*"
